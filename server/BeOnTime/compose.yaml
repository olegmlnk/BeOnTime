services:
  beontime:
    image: beontime
    build:
      context: .
      dockerfile: BeOnTime.API/Dockerfile
    ports:
      - "5205:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=BeOnTimeDb;User Id=sa;Password=YourStr0ng!Pass;TrustServerCertificate=True
      - JwtOptions__Issuer=BeOnTimeAPI
      - JwtOptions__Audience=BeOnTimeClient
      - JwtOptions__Secret=gwZU+qSgFjli07jWYJxYdE3fnQpfrJAIDcQR5lGSRGQ=
      - JwtOptions__ExpirationTimeInMinutes=10
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStr0ng!Pass
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStr0ng!Pass" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sqldata:
