name: CD — Deploy to VPS

on:
  workflow_run:
    workflows: ["CI — Tests"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Deploy via SSH
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          HOST=$(echo "${{ secrets.VPS_HOST }}" | tr -d '[:space:]')
          USER=$(echo "${{ secrets.VPS_USER }}" | tr -d '[:space:]')
          echo "Connecting to ${USER}@${HOST}"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 "${USER}@${HOST}" bash -s << 'DEPLOY_SCRIPT'
            set -e
            cd /root/BeOnTime

            echo "=== Pulling latest changes ==="
            git pull origin main

            echo "=== Rebuilding and restarting services ==="
            docker compose up -d --build

            echo "=== Waiting for services to start ==="
            sleep 15

            echo "=== Reloading nginx ==="
            docker compose exec frontend nginx -s reload || true

            echo "=== Service status ==="
            docker compose ps

            echo "=== Deploy complete! ==="
          DEPLOY_SCRIPT
