name: CD — Deploy to VPS

on:
  workflow_run:
    workflows: ["CI — Tests"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" << 'DEPLOY_SCRIPT'
            cd /root/BeOnTime

            echo "=== Pulling latest changes ==="
            git pull origin main

            echo "=== Rebuilding and restarting services ==="
            docker compose up -d --build

            echo "=== Waiting for services to start ==="
            sleep 15

            echo "=== Reloading nginx ==="
            docker compose exec frontend nginx -s reload || true

            echo "=== Service status ==="
            docker compose ps

            echo "=== Deploy complete! ==="
          DEPLOY_SCRIPT
